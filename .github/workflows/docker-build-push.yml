name: Build and Push Docker Image

# Why this exists: the image was being built by hand on the deployment host and pushed
# with a personal token, and that token has never carried write:packages, so the registry
# copy silently fell behind what production was running. A GITHUB_TOKEN scoped to this
# workflow has packages:write by default, needs no secret, and cannot fall out of date.
# This repo is public, so the minutes are free.

on:
  push:
    # `master` until 2026-08-29, and that branch has never existed in this repo: `main`
    # is the only branch and has always been the default. So the push trigger never
    # fired once, every image was built by hand or by dispatch, and a green `git push`
    # published nothing while looking exactly like a successful release.
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build (defaults to the deployed tag)'
        required: false
        default: mobile-redesign

concurrency:
  # One build per branch. A queued rebuild of the same tag makes the earlier one
  # pointless, and two racing pushes to one tag is how a registry ends up serving
  # whichever finished last rather than whichever was newer.
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deployment on kesserver pins `mobile-redesign`, so that tag has to keep
      # moving or nothing there ever changes. `latest` and the commit SHA ride along:
      # the SHA is what makes "which build is this box running" answerable later.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/akeslo/podcast-ad-remover:${{ github.event.inputs.tag || 'mobile-redesign' }}
            ghcr.io/akeslo/podcast-ad-remover:latest
            ghcr.io/akeslo/podcast-ad-remover:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Merged is not deployed. The host runs no watchtower for this container, so a
      # green build here means the registry is current and nothing more; the deploy is
      # still a pull and recreate on the box.
      - name: Say what was published
        run: |
          echo "Pushed ghcr.io/akeslo/podcast-ad-remover:${{ github.event.inputs.tag || 'mobile-redesign' }}"
          echo "Deploy it with: docker compose pull && docker compose up -d"
