{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-120px)]">
    <div class="w-full max-w-md">
        <div class="card-glass">
            <h2 class="font-display text-2xl font-bold text-center mb-6">Change Password</h2>

            {% if required %}
            <div class="alert-info mb-6">
                <div>
                    <strong>Password Change Required</strong>
                    <p class="text-sm">You must change your password before continuing.</p>
                </div>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert-error mb-4">
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/change-password" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-text-secondary mb-2">Current Password</label>
                    <input type="password" name="current_password" required class="input">
                </div>

                <div>
                    <label class="block text-sm font-medium text-text-secondary mb-2">New Password</label>
                    <input type="password" name="new_password" required minlength="8" class="input">
                    <p class="text-xs text-text-secondary mt-1">Minimum 8 characters</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-text-secondary mb-2">Confirm New Password</label>
                    <input type="password" name="confirm_password" required minlength="8" class="input">
                </div>

                <button type="submit" class="btn-primary w-full">
                    Change Password
                </button>
            </form>

            {% if not required %}
            <div class="mt-4 text-center">
                <a href="/admin/system" class="text-sm text-text-secondary hover:text-text-primary transition-colors">Cancel</a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
